<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="" />
    <link rel="stylesheet" href="./assets/loginStyle.css" />
  </head>
  <body>
    <header>
      <h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
      <nav>
        <ul>
          <li>projets</li>
          <li>contact</li>
          <li><a href="Login.html">login</a></li>
          <li><img src="./assets/icons/instagram.png" alt="Instagram" /></li>
        </ul>
      </nav>
    </header>
    <main>
      <h2 class="login">Log In</h2>
      <div class="mainConnection">
        <form action="" method="post" id="connectionForm">
          <div class="connectionInput">
            <label class="labelEmail" for="email" autocomplete="email"
              >E-mail</label
            >
            <input type="text" name="email" id="email" />
            <label class="labelPassword" for="password">Mot de passe</label>
            <input
              type="password"
              name="password"
              id="password"
              autocomplete="current-password"
            />
          </div>
          <button>Se connecter</button>
        </form>
        <a href="#">Mot de passe oublié</a>
      </div>
        <p class="errorMessage">Identifiant ou Mot de passe incorrect</p>
    </main>
    <footer>
      <nav>
        <ul>
          <li>Mentions Légales</li>
        </ul>
      </nav>
    </footer>
    <script src="loginAPI.js"></script>
  </body>
</html>
